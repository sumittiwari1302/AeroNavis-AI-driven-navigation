# AeroNavis 3.0 — global configuration
# Flat namespaced keys only: `namespace.key` on a single line. No YAML nesting.
# Every key referenced here has a matching field in src/aeronavis/config.py; the
# dataclass spec is the source of truth for key existence and value types.

# --- sensor -----------------------------------------------------------------
# Native sampling rates of the on-board instruments feeding the pipeline.
sensor.imu_hz: 100
sensor.gnss_hz: 1
sensor.cam_hz: 10

# --- model ------------------------------------------------------------------
# Window/stride govern the sliding context fed to learned dead-reckoning nets;
# they appear in velocity & pseudo-odo forecasts, so every model shares them.
model.window: 200
model.stride: 10
model.velocity_hidden: 128
model.max_params: 500000
# Pseudo wheel odometry (DeepOdo-style)
model.pseudo_odo_hidden: 96
model.pseudo_odo_max_params: 300000
# Slip classifier
model.slip_hidden: 48
model.slip_max_params: 200000
# Texture gate
model.texture_gate_max_params: 100000
# Visual odometry
model.visual_odo_max_params: 1000000

# --- adaptation ---------------------------------------------------------------
# LoRA adapters for test-time adaptation
model.lora_rank: 8
model.lora_alpha: 16
model.lora_max_bytes: 200000
# Adaptation loss weights
adaptation.l_vel_weight: 1.0
adaptation.l_smooth_weight: 0.5
adaptation.l_gnss_weight: 1.0
# Update schedule
adaptation.update_every_n: 5
adaptation.window_size: 10
adaptation.lr: 0.0001
adaptation.momentum: 0.9
adaptation.clip_norm: 1.0
# Guards
adaptation.loss_window_s: 30
adaptation.freeze_threshold_pct: 10.0
adaptation.gnss_residual_patience: 3

# --- texture ----------------------------------------------------------------
# Keypoint-texture thresholds used to judge visual-odo track quality.
texture.threshold.rich: 2000.0
texture.threshold.medium: 400.0

# --- fusion -----------------------------------------------------------------
# Below this displacement a GNSS fix is treated as stationary, not a reseed.
fusion.reseed_jump_max_m: 0.3
# Process noise (continuous-time, diagonal)
fusion.proc_noise_gyro_bias: 0.000001
fusion.proc_noise_accel_bias: 0.0001
fusion.proc_noise_gyro: 0.0001
fusion.proc_noise_accel: 0.0001
# Measurement noise (diagonal, will be inflated by seeder/learned noise)
fusion.gnss_pos_std: 0.5
fusion.gnss_vel_std: 0.5
fusion.wheel_speed_std: 0.1
fusion.wheel_nhc_std: 0.05
fusion.vo_pos_std: 0.5
fusion.vo_yaw_std: 0.05
# Learned noise MLP
fusion.learned_noise_hidden: 64
fusion.learned_noise_max_params: 50000
# Numerical safety
fusion.min_eig: 0.000000000001
fusion.psd_inflation_factor: 1.5
fusion.residual_gate_sigma: 6.0

# --- predict ----------------------------------------------------------------
# Outage forecaster emits success probabilities at these look-ahead horizons.
predict.horizons: [5, 10, 15]
predict.threshold: 0.85

# --- data --------------------------------------------------------------------
# Target sampling rates of the normalized internal format (NavSequence).
data.imu_hz: 100
data.gnss_hz: 1
data.wheel_hz: 10
data.truth_hz: 10
data.mag_hz: 50
data.baro_hz: 25
data.cam_hz: 10
# Quality gates: reject sequences shorter than this or with worse GNSS coverage.
data.min_seq_s: 60
data.min_gnss_coverage: 0.3
# A repeat gap strictly larger than this splits a sequence (we keep the longest
# contiguous span and log the drops).
data.max_gap_ms: 200
# A GNSS fix gap beyond this is declared an outage interval (start, end).
data.outage_min_gap_s: 2.0
# WGS-84 semi-major axis, the only physical constant used for ENU projections.
data.earth_radius_m: 6378137.0

# --- splits ------------------------------------------------------------------
# Train/val/test proportions. The seeding comes from the global `seed`; ratios
# are targets that grouped drive-atoms make only approximately exact.
splits.train_ratio: 0.7
splits.val_ratio: 0.15

# --- paths ------------------------------------------------------------------
# Canonical artifacts locations; kept relative to the repo root.
paths.raw: data/raw
paths.processed: data/processed
paths.splits: data/splits
paths.models: models
paths.benchmarks: benchmarks
paths.maps: data/maps

# --- app: offline maps -------------------------------------------------------
# Offline OSM road graph (imported once, used offline)
app.offline: true
app.map_candidate_radius: 25.0
app.map_viterbi_window: 20

# --- app: map-matching -------------------------------------------------------
# Hidden-Markov Viterbi snap to road segments
mapmatch.candidate_radius: 25.0
mapmatch.viterbi_window: 20
mapmatch.emission_gps_weight: 1.0
mapmatch.emission_heading_weight: 0.5
mapmatch.transition_speed_weight: 1.0
mapmatch.gnss_health_threshold: 0.7

# --- app: re-anchor ----------------------------------------------------------
# Re-anchor state machine: DROPPED -> COASTING -> REACQUIRING -> REANCHORED
ranchor.reacquire_threshold: 5.0
ranchor.converge_window_s: 3.0
ranchor.blend_s: 5.0
ranchor.max_jump_m: 0.5
ranchor.consecutive_good: 3

# --- paths (continued) -------------------------------------------------------
# Canonical artifacts locations; kept relative to the repo root.
paths.raw: data/raw
paths.processed: data/processed
paths.splits: data/splits
paths.models: models
paths.benchmarks: benchmarks
paths.maps: data/maps

# --- runtime ----------------------------------------------------------------
seed: 42